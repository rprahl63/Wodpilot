name: CI – Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BOT_IMAGE: ghcr.io/${{ github.repository_owner }}/wodpilot-bot
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/wodpilot-web
  PI_AGENT_IMAGE: ghcr.io/${{ github.repository_owner }}/wodpilot-pi-agent

jobs:
  # ─── Python Tests ──────────────────────────────────────────────────────────
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ─── TypeScript Type-Check ─────────────────────────────────────────────────
  typecheck-typescript:
    name: TypeScript Type-Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi-agent-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pi-agent-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc)
        run: npm run build

  # ─── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-python, typecheck-typescript]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.bot
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.BOT_IMAGE }}:latest
            ${{ env.BOT_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push pi-agent image
        uses: docker/build-push-action@v6
        with:
          context: ./pi-agent-service
          file: pi-agent-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.PI_AGENT_IMAGE }}:latest
            ${{ env.PI_AGENT_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Write .env and deploy
        uses: appleboy/ssh-action@v1
        env:
          DOT_ENV: |
            TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
            ADMIN_TELEGRAM_ID=${{ secrets.ADMIN_TELEGRAM_ID }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            WEB_SECRET_KEY=${{ secrets.WEB_SECRET_KEY }}
            WEB_ADMIN_PASSWORD=${{ secrets.WEB_ADMIN_PASSWORD }}
            DOMAIN=${{ secrets.DOMAIN }}
            ACME_EMAIL=${{ secrets.ACME_EMAIL }}
            INTERNAL_API_TOKEN=${{ secrets.INTERNAL_API_TOKEN }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            GITHUB_OWNER=${{ github.repository_owner }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DOT_ENV
          script: |
            set -e
            mkdir -p /opt/wodpilot
            printf '%s\n' "$DOT_ENV" > /opt/wodpilot/.env

            cd /opt/wodpilot

            # Ensure proxy network exists (created by cloud-init, but just in case)
            docker network create proxy 2>/dev/null || true

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Fetch latest docker-compose.yml
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml \
              -o docker-compose.yml

            # Pull & start with the specific SHA tag
            IMAGE_TAG=${{ github.sha }} docker compose pull
            IMAGE_TAG=${{ github.sha }} docker compose up -d --remove-orphans

            # Cleanup old images
            docker image prune -f
