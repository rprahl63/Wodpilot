version: "3.9"

services:
  bot:
    image: ghcr.io/${GITHUB_OWNER}/wodpilot-bot:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot_data:/data
    networks:
      - internal
    labels:
      - "com.wodpilot.service=bot"

  web:
    image: ghcr.io/${GITHUB_OWNER}/wodpilot-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    env_file: .env
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wodpilot-web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.wodpilot-web.entrypoints=websecure"
      - "traefik.http.routers.wodpilot-web.tls.certresolver=le"
      - "traefik.http.services.wodpilot-web.loadbalancer.server.port=8080"
      - "traefik.docker.network=proxy"

  pi-agent-service:
    image: ghcr.io/${GITHUB_OWNER}/wodpilot-pi-agent:${IMAGE_TAG:-latest}
    build:
      context: ./pi-agent-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PYTHON_API_URL=http://web:8080
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    networks:
      - internal
    labels:
      - "com.wodpilot.service=pi-agent"

  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/data/acme.json"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--api.dashboard=false"
      - "--log.level=WARN"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_data:/data
    networks:
      - proxy

networks:
  internal:
    driver: bridge
  proxy:
    external: true

volumes:
  bot_data:
  traefik_data:
