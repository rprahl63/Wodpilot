# supabase-py builds its URLs as "{SUPABASE_URL}/rest/v1/...", but PostgREST
# serves at the root. This strips the prefix so the app code stays unchanged.
server {
    listen 3000;
    server_name _;

    # Embeddings are 1536 floats; batch writes get chunky.
    client_max_body_size 16m;

    location /rest/v1/ {
        proxy_pass http://postgrest:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        # PostgREST authenticates off the Authorization header; pass it verbatim.
        proxy_set_header Authorization     $http_authorization;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Nothing else is a legitimate call from the app.
    location / { return 404; }
}
