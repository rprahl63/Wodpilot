<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WODpilot{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #0d1117; color: #e6edf3; }
        .navbar { background-color: #161b22; border-bottom: 1px solid #30363d; }
        .navbar .brand { font-size: 1.2rem; font-weight: 700; color: #58a6ff; }
        .navbar .nav-link { color: #8b949e; }
        .navbar .nav-link:hover, .navbar .nav-link.active { color: #e6edf3; }
        .card { background-color: #161b22; border-color: #30363d; }
        .session-desc { white-space: pre-wrap; font-size: .92rem; color: #c9d1d9; }
        .day-today { border-color: #388bfd; }
        .muted { color: #8b949e; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand px-3 py-2 mb-4">
    <a href="{{ url_for('athlete.week') }}" class="brand text-decoration-none me-4">🏋️ WODpilot</a>
    {% if session.athlete_user_id %}
    <ul class="navbar-nav me-auto gap-2">
        <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'athlete.week' %}active{% endif %}"
               href="{{ url_for('athlete.week') }}"><i class="bi bi-calendar3"></i> Wochenplan</a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'athlete.preferences' %}active{% endif %}"
               href="{{ url_for('athlete.preferences') }}"><i class="bi bi-sliders"></i> Präferenzen</a>
        </li>
    </ul>
    <a href="{{ url_for('athlete.logout') }}" class="nav-link text-danger">
        <i class="bi bi-box-arrow-right"></i> Logout
    </a>
    {% endif %}
</nav>

<div class="container pb-5" style="max-width: 900px;">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category if category in ['success','warning','danger','info'] else 'info' }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
