<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>WODpilot Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>body { background: #0d1117; }</style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card p-4" style="width:360px;background:#161b22;border-color:#30363d;">
        <h2 class="mb-4 text-center" style="color:#58a6ff;">🏋️ WODpilot</h2>
        <p class="text-center text-muted mb-4">Admin Dashboard</p>
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Passwort</label>
                <input type="password" name="password" class="form-control" autofocus required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Anmelden</button>
        </form>
    </div>
</body>
</html>
