<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WODpilot Admin{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #0d1117; color: #e6edf3; }
        .sidebar { background-color: #161b22; min-height: 100vh; width: 220px; }
        .sidebar .nav-link { color: #8b949e; padding: .5rem 1rem; border-radius: .375rem; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #21262d; color: #e6edf3; }
        .sidebar .brand { font-size: 1.3rem; font-weight: 700; color: #58a6ff; }
        .main-content { flex: 1; }
        .card { background-color: #161b22; border-color: #30363d; }
        .table { --bs-table-bg: #161b22; --bs-table-border-color: #30363d; }
        .badge-admin { background: #388bfd22; color: #58a6ff; border: 1px solid #388bfd44; }
        pre { background: #0d1117; border: 1px solid #30363d; padding: 1rem; border-radius: .375rem; font-size: .85rem; }
    </style>
</head>
<body>
<div class="d-flex">
    {% if session.logged_in %}
    <nav class="sidebar d-flex flex-column p-3 gap-1" style="position:sticky;top:0;height:100vh;overflow-y:auto;">
        <a href="/" class="brand text-decoration-none mb-3">🏋️ WODpilot</a>
        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <a href="/chat" class="nav-link {% if '/chat' in request.path %}active{% endif %}">
            <i class="bi bi-chat-dots"></i> Chat
        </a>
        <a href="/users" class="nav-link {% if '/users' in request.path %}active{% endif %}">
            <i class="bi bi-people"></i> Users
        </a>
        <a href="/codes" class="nav-link {% if '/codes' in request.path %}active{% endif %}">
            <i class="bi bi-key"></i> Invite Codes
        </a>
        <a href="/wods" class="nav-link {% if '/wods' in request.path %}active{% endif %}">
            <i class="bi bi-calendar3"></i> WODs
        </a>
        <a href="/config" class="nav-link {% if '/config' in request.path %}active{% endif %}">
            <i class="bi bi-gear"></i> Konfiguration
        </a>
        <div class="mt-auto">
            <a href="/logout" class="nav-link text-danger">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </nav>
    {% endif %}

    <div class="main-content p-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category if category in ['success','warning','danger','info'] else 'info' }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
